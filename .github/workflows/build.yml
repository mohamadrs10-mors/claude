name: Build apps

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # MASTER_KEY_HASH is optional: without the secret the build has no master recovery.
      - run: flutter build apk --release --dart-define=MASTER_KEY_HASH=${{ secrets.MASTER_KEY_HASH }}
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=MASTER_KEY_HASH=${{ secrets.MASTER_KEY_HASH }}
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-windows
          path: build/windows/x64/runner/Release/
