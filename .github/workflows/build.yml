name: Build apps

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # MASTER_KEY_HASH is optional: without the secret the build has no master recovery.
      - run: flutter build apk --release --dart-define=MASTER_KEY_HASH=${{ secrets.MASTER_KEY_HASH }}
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=MASTER_KEY_HASH=${{ secrets.MASTER_KEY_HASH }}
      - uses: actions/upload-artifact@v4
        with:
          name: accounting-windows
          path: build/windows/x64/runner/Release/
      # A one-file installer (Inno Setup). Optional: if it fails the zip above is still published.
      - name: Build installer
        id: installer
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $env:APP_VERSION = ($v -split '\+')[0]
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\mors_acc.iss
      - uses: actions/upload-artifact@v4
        if: steps.installer.outcome == 'success'
        with:
          name: accounting-windows-setup
          path: build/installer/MORS-ACC-Setup.exe
